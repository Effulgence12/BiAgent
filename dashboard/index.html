<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agentic BI — Olist 运营分析系统</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header>
      <h1>Agentic BI — Olist 运营分析系统</h1>
      <p>最小可运行骨架：自然语言问题 → Agent 计划 → 视图优先 SQL → 图表类型与建议占位。</p>
    </header>
    <main class="layout">
      <section class="panel chat-panel">
        <h2>对话区</h2>
        <div id="messages" class="messages">
          <article class="message assistant">请输入一个 Olist 运营问题，例如：2017年各月GMV趋势？</article>
        </div>
        <form id="question-form" class="composer">
          <input id="question" name="question" placeholder="输入业务问题..." required />
          <button type="submit">发送</button>
        </form>
      </section>
      <section class="panel result-panel">
        <h2>分析结果</h2>
        <div class="tabs">
          <button class="active" type="button">SQL</button>
          <button type="button">图表</button>
          <button type="button">建议</button>
        </div>
        <pre id="result" class="result">等待分析请求...</pre>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
